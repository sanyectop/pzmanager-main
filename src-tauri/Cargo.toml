[package]
name = "pzmanager"
version = "1.7.261114-devbuild.1794501007"
description = "Project Zomboid launcher + mod manager"
authors = ["叁葉 (sanyectop)"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pzmanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 与覆盖层 DLL 共用的纯解析逻辑（阶段/完成标记/进度估算）。
overlay-core = { path = "../overlay-core" }
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-clipboard-manager = "2.4.1"
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "query",
    "form",
    # 下面几项是 reqwest 0.13 的默认 features，这里显式保留，避免关掉 default-features 后行为变化。
    "charset",
    "http2",
    "system-proxy",
    # 本地代理设置支持 socks5:// 地址（Clash/V2Ray 等常暴露 socks 端口）。
    "socks",
    # TLS 后端使用 Windows 原生 schannel（native-tls），而不是 reqwest 默认的
    # rustls + aws-lc-rs。aws-lc-sys 需要在构建期调用 MSVC 的 cl.exe 编译 C 代码，
    # 本机历史上出现过 "error D8050: 无法执行 c1.dll" 导致的构建失败。
    # native-tls 走 schannel，完全不依赖 C 编译器，因此构建更稳、更快。
    # 若要换回 rustls，请先确认 MSVC 的 C 工具链（cl.exe）可正常工作。
    "native-tls",
] }
futures-util = "0.3"
regex = "1"
tokio = { version = "1", features = ["time"] }
java-class-rs = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
sha2 = "0.10"
# 版本隔离的文件复制用 rayon 的有界线程池（按磁盘/核心数开 1–16 个 worker）。
rayon = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }

[features]
# 把覆盖层注入后端切换为 dll-syringe。
# 注意：dll-syringe 所有已发布版本都启用了 nightly 专属 feature，
# 启用本 feature 必须用 nightly 工具链构建，详见 docs/overlay-injection.md。
dll-syringe-inject = ["dep:dll-syringe"]

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# 覆盖层注入默认使用原生 Win32（CreateRemoteThread + LoadLibraryW），stable 工具链可直接编译。
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    # 「以管理员身份重启」用 ShellExecuteW 的 runas 动词。
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }
# 离线启动的创意工坊映射：创建目录联接（junction，无需管理员权限），rustup 同款实现。
junction = "1"
# 可选注入后端，仅在启用 dll-syringe-inject feature 时参与编译（需要 nightly）。
# 只启用 syringe 功能：默认 features 会额外拉入 RPC 与“x64 注入 x86”支持，本阶段用不上。
dll-syringe = { version = "0.18.2", optional = true, default-features = false, features = ["syringe"] }

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
