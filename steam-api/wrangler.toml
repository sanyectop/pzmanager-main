name = "pzm-steam-relay"
main = "worker.js"
compatibility_date = "2025-09-01"

# 路由不写在这里：首次部署后到控制台绑定（Workers & Pages → pzm-steam-relay
# → Settings → Domains & Routes → Add → Route），pattern 填
#   pzmapi.sanyec.top/steam/*    zone 选 sanyec.top
# Workers 路由优先于同域名的 Pages 自定义域，update-api 的 /api/latest.json
# 不受影响。workers.dev 的默认域名在大陆被墙，不要用它当正式入口。
#
# 绑定好路由后，之后的再部署也可以把路由写进这里省去手工步骤：
# routes = [
#   { pattern = "pzmapi.sanyec.top/steam/*", zone_name = "sanyec.top" },
# ]
