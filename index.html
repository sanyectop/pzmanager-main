<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pzmanager</title>
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/Inter/Inter-latin.woff2"
      crossorigin
    />
    <style>
      /* Splash screen. Inlined so it paints before the JS/CSS bundle loads. */
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/fonts/Inter/Inter-latin.woff2") format("woff2");
      }

      .pz-splash {
        position: fixed;
        inset: 0;
        /* Sits above the toast viewport (also max z-index) via DOM order. */
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #ffffff;
        opacity: 1;
      }

      .pz-splash.is-hiding {
        opacity: 0;
        transition: opacity 200ms ease;
      }

      .pz-splash-text {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: clamp(2.4rem, 6vw, 3.6rem);
        line-height: 1.1;
        color: #4a9ae8;
        user-select: none;
        /* Reveal the lockup left to right through a soft gradient mask. */
        -webkit-mask-image: linear-gradient(90deg, transparent 0%, transparent 33%, #000 66%, #000 100%);
        mask-image: linear-gradient(90deg, transparent 0%, transparent 33%, #000 66%, #000 100%);
        -webkit-mask-size: 300% 100%;
        mask-size: 300% 100%;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: 0% 0;
        mask-position: 0% 0;
        animation: pz-splash-reveal 200ms ease-out forwards;
      }

      .pz-splash-brand {
        font-size: 1em;
        font-weight: 700;
        letter-spacing: 0.01em;
      }

      .pz-splash-suffix {
        font-size: 0.5em;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      @keyframes pz-splash-reveal {
        from {
          -webkit-mask-position: 0% 0;
          mask-position: 0% 0;
        }

        to {
          -webkit-mask-position: 100% 0;
          mask-position: 100% 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .pz-splash-text {
          animation-duration: 1ms;
        }

        .pz-splash.is-hiding {
          transition-duration: 1ms;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <!-- Kept after #root so it paints over the toast viewport. -->
    <div aria-hidden="true" class="pz-splash" id="pz-splash">
      <div class="pz-splash-text">
        <span class="pz-splash-brand">ProjectZomboid</span>
        <span class="pz-splash-suffix">Manager</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Safety net: never leave the splash up if the bundle fails to boot.
      window.setTimeout(function () {
        var splash = document.getElementById("pz-splash");
        if (!splash) return;
        splash.classList.add("is-hiding");
        window.setTimeout(function () {
          splash.remove();
        }, 220);
      }, 8000);
    </script>
  </body>
</html>
